name: Build AutoTrade

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cho phép chạy gradlew
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload file .jar vừa build
        uses: actions/upload-artifact@v4
        with:
          name: autotrade-jar
          path: build/libs/*.jar
